<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0b0b;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
}

/* =========================
   CONTAINER UTAMA
========================= */

.video-container {
    width: 100%;
    height: 100dvh;
    max-width: 900px;
    margin: 0 auto;

    display: flex;
    flex-direction: column;

    padding: 6px;
}

/* =========================
   BANNER ADSTERRA
========================= */

.ad-banner {
    width: 100%;
    height: 70px;
    min-height: 70px;

    margin-bottom: 6px;

    background: #151515;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    border-radius: 5px;
}

/* =========================
   VIDEO PLAYER
========================= */

.player {
    position: relative;

    width: 100%;

    /*
     * Video mengambil ruang yang tersedia
     * agar CTA tetap terlihat.
     */
    flex: 1;

    min-height: 0;

    background: #000;

    border-radius: 6px;
    overflow: hidden;

    box-shadow: 0 5px 25px rgba(0,0,0,.5);
}

video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: #000;
}

/* Hilangkan fullscreen native */
video::-webkit-media-controls-fullscreen-button {
    display: none !important;
}

/* =========================
   CTA
========================= */

.viral-button {
    display: flex;

    width: 100%;

    height: 54px;
    min-height: 54px;

    margin-top: 6px;

    align-items: center;
    justify-content: center;

    padding: 0 12px;

    background: linear-gradient(
        135deg,
        #ff1744,
        #ff5722
    );

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 800;

    letter-spacing: .4px;

    border-radius: 7px;

    box-shadow:
        0 5px 20px rgba(255, 23, 68, .3);

    flex-shrink: 0;

    transition: .2s ease;
}

.viral-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(255, 23, 68, .45);
}

.viral-button:active {
    transform: scale(.98);
}

/* =========================
   HP KECIL
========================= */

@media(max-width:600px) {

    .video-container {
        padding: 4px;
    }

    .ad-banner {
        height: 60px;
        min-height: 60px;
        margin-bottom: 4px;
    }

    .player {
        border-radius: 5px;
    }

    .viral-button {
        height: 50px;
        min-height: 50px;

        margin-top: 4px;

        font-size: 15px;
    }
}

/* =========================
   HP SANGAT PENDEK
   Contoh: 667px atau kurang

@media(max-height:700px) and (max-width:600px) {
